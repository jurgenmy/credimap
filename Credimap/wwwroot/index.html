<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
	<title>Credimap - Sucursales y Ubicaciones</title>
	<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
	<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js" integrity="sha512-+uNw7sQ2mI8Qk9uJ5xQmQ8J1qjZr+uEwC1sR0pV8pZP8ZyIY0Yf8C0bR9mR1jz4o3mYw+YQ4mV5b3s8m0Wm9fA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
	<style>
		html, body { height: 100%; margin: 0; }
		#map { position: absolute; top: 0; bottom: 0; width: 100%; }
		.popup-title { font-weight: 600; }
		.popup-sub { color: #374151; font-size: 12px; margin-top: 2px; }
		.notice { position: absolute; z-index: 10; top: 8px; left: 8px; background: rgba(0,0,0,.6); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px; }
	</style>
</head>
<body>
	<div id="map"></div>
	<div id="notice" class="notice" style="display:none"></div>
	<script>
		// === Configurable Mapbox token ===
		mapboxgl.accessToken = 'pk.eyJ1IjoianVyZ2VubSIsImEiOiJjbWc5a3A0aDIwOTdwMmpxMXk5OXpqOGxhIn0.M9o_AhZuvPoniMEhYphhZg';

		const map = new mapboxgl.Map({
			container: 'map',
			style: 'mapbox://styles/mapbox/streets-v12',
			center: [-68.057, -38.95],
			zoom: 11
		});

		// Keep markers for sucursales and users
		const sucursalMarkers = [];
		const userMarkers = new Map(); // userId -> marker

		const noticeEl = document.getElementById('notice');
		function showNotice(msg) {
			noticeEl.textContent = msg;
			noticeEl.style.display = 'block';
			setTimeout(() => noticeEl.style.display = 'none', 5000);
		}

		// Load sucursales markers
		fetch('/api/sucursales')
			.then(r => r.json())
			.then(data => {
				(data || []).forEach(s => {
					const el = document.createElement('div');
					el.style.width = '14px';
					el.style.height = '14px';
					el.style.borderRadius = '50%';
					el.style.background = '#1d4ed8';
					el.style.boxShadow = '0 0 0 2px white';
					const rubro = s.rubro && s.rubro.length ? `<div class="popup-sub">${s.rubro}</div>` : '';
					const marker = new mapboxgl.Marker(el)
						.setLngLat([s.lng, s.lat])
						.setPopup(new mapboxgl.Popup({ offset: 24 }).setHTML(`<div class=\"popup-title\">${s.nombre}</div>${rubro}`))
						.addTo(map);
					sucursalMarkers.push(marker);
				});
			})
			.catch(() => showNotice('No se pudo cargar /api/sucursales'));

		// SignalR connection
		const userId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
		const connection = new signalR.HubConnectionBuilder()
			.withUrl('/hubs/location')
			.withAutomaticReconnect()
			.build();

		connection.on('ReceiveLocationUpdate', ({ userId: otherId, lat, lng }) => {
			if (!otherId) return;
			let marker = userMarkers.get(otherId);
			if (!marker) {
				const el = document.createElement('div');
				el.style.width = '14px';
				el.style.height = '14px';
				el.style.borderRadius = '50%';
				el.style.background = '#ef4444'; // red for others
				el.style.boxShadow = '0 0 0 2px white';
				marker = new mapboxgl.Marker(el).setLngLat([lng, lat]).addTo(map);
				userMarkers.set(otherId, marker);
			} else {
				marker.setLngLat([lng, lat]);
			}
		});

		connection.start().catch(err => console.error(err));

		// Geolocation: allow on any protocol as requested
		let selfMarker = null;
		if (navigator.geolocation) {
			navigator.geolocation.watchPosition(pos => {
				const { latitude, longitude } = pos.coords;
				if (!selfMarker) {
					const el = document.createElement('div');
					el.style.width = '16px';
					el.style.height = '16px';
					el.style.borderRadius = '50%';
					el.style.background = '#10b981'; // green for self
					el.style.boxShadow = '0 0 0 2px white';
					selfMarker = new mapboxgl.Marker(el).setLngLat([longitude, latitude]).addTo(map);
				} else {
					selfMarker.setLngLat([longitude, latitude]);
				}
				// send to server
				if (connection.state === signalR.HubConnectionState.Connected) {
					connection.invoke('SendLocation', userId, latitude, longitude).catch(() => {});
				}
			}, err => {
				showNotice('Geolocalización no disponible: ' + err.message);
			}, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
		} else {
			showNotice('Geolocalización no soportada por este navegador.');
		}
	</script>
</body>
</html>
