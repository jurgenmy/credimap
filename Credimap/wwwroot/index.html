<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
	<title>Credimap - Sucursales y Ubicaciones</title>
	<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
	<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
	<style>
		html, body { height: 100%; margin: 0; }
		#map { position: absolute; top: 0; bottom: 0; width: 100%; }
		.popup-title { font-weight: 600; }
		.popup-sub { color: #374151; font-size: 12px; margin-top: 2px; }
		.notice { position: absolute; z-index: 10; top: 8px; left: 8px; background: rgba(0,0,0,.6); color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px; }
	</style>
</head>
<body>
	<div id="map"></div>
	<div id="notice" class="notice" style="display:none"></div>
	<script>
		// === Mapbox token (configurable) ===
		mapboxgl.accessToken = 'pk.eyJ1IjoianVyZ2VubSIsImEiOiJjbWc5a3A0aDIwOTdwMmpxMXk5OXpqOGxhIn0.M9o_AhZuvPoniMEhYphhZg';

		const map = new mapboxgl.Map({
			container: 'map',
			style: 'mapbox://styles/mapbox/streets-v12',
			center: [-68.057, -38.95],
			zoom: 11
		});

		const sucursalMarkers = [];
		const noticeEl = document.getElementById('notice');
		function showNotice(msg) {
			noticeEl.textContent = msg;
			noticeEl.style.display = 'block';
			setTimeout(() => noticeEl.style.display = 'none', 6000);
		}

		// Load sucursales markers
		fetch('/api/sucursales')
			.then(r => r.json())
			.then(data => {
				(data || []).forEach(s => {
					const el = document.createElement('div');
					el.style.width = '14px';
					el.style.height = '14px';
					el.style.borderRadius = '50%';
					el.style.background = '#1d4ed8';
					el.style.boxShadow = '0 0 0 2px white';
					const rubro = s.rubro && s.rubro.length ? `<div class="popup-sub">${s.rubro}</div>` : '';
					const marker = new mapboxgl.Marker(el)
						.setLngLat([s.lng, s.lat])
						.setPopup(new mapboxgl.Popup({ offset: 24 }).setHTML(`<div class=\"popup-title\">${s.nombre}</div>${rubro}`))
						.addTo(map);
					sucursalMarkers.push(marker);
				});
			})
			.catch(() => showNotice('No se pudo cargar /api/sucursales'));

		// Geolocalización del promotor (cliente)
		let selfMarker = null;
		let lastUpdateTs = 0;
		const MIN_UPDATE_MS = 2000; // throttle updates

		function upsertSelfMarker(lng, lat) {
			if (!selfMarker) {
				const el = document.createElement('div');
				el.style.width = '16px';
				el.style.height = '16px';
				el.style.borderRadius = '50%';
				el.style.background = '#10b981'; // verde: ubicación propia
				el.style.boxShadow = '0 0 0 2px white';
				selfMarker = new mapboxgl.Marker(el).setLngLat([lng, lat]).addTo(map);
			} else {
				selfMarker.setLngLat([lng, lat]);
			}
		}

		if (navigator.geolocation) {
			navigator.geolocation.watchPosition(position => {
				const now = Date.now();
				if (now - lastUpdateTs < MIN_UPDATE_MS) return;
				lastUpdateTs = now;
				const { latitude, longitude } = position.coords;
				upsertSelfMarker(longitude, latitude);
			}, error => {
				if (error.code === error.PERMISSION_DENIED) {
					showNotice('Necesitamos permiso de geolocalización para mostrar tu ubicación.');
				} else if (error.code === error.POSITION_UNAVAILABLE) {
					showNotice('Ubicación no disponible. Verifica tu GPS/servicios de ubicación.');
				} else if (error.code === error.TIMEOUT) {
					showNotice('Tiempo de espera agotado al obtener ubicación.');
				} else {
					showNotice('Error de geolocalización.');
				}
			}, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
		} else {
			showNotice('Geolocalización no soportada por este navegador.');
		}
	</script>
</body>
</html>
